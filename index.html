function upcoming(){let t=today(),a=[];Object.entries(events).forEach(([date,evs])=>{if(date>=t)Object.entries(evs||{}).forEach(([id,v])=>a.push({date,id,...v}))});return a.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4)}function renderPreview(){let up=upcoming();$('eventPreview').innerHTML=up.length?up.map(e=>`<div class="preview-item">📌 <b>${esc(e.date.slice(5))}</b> ${esc(e.title)} <span class="muted">${esc(e.time||'')}</span></div>`).join(''):'<p class="empty">다가오는 일정이 없어요.</p>';let msgs=Object.entries(messages).sort((a,b)=>a[0].localeCompare(b[0])).slice(-3);$('chatPreview').innerHTML=msgs.length?msgs.map(([id,m])=>`<div class="preview-item">💬 <b>${esc(m.from)}</b>: ${esc(m.text)}</div>`).join(''):'<p class="empty">가족에게 첫 메시지를 보내 보세요 💜</p>'}
function renderCalendar(){let year=month.getFullYear(),mon=month.getMonth(),first=new Date(year,mon,1).getDay(),last=new Date(year,mon+1,0).getDate();$('monthLabel').textContent=`${year}년 ${mon+1}월`;$('calendarGrid').innerHTML=weekday.map(d=>`<div class="small" style="text-align:center">${d}</div>`).join('')+Array.from({length:first},()=>'<div></div>').join('')+Array.from({length:last},(_,i)=>{let date=localDate(new Date(year,mon,i+1)),ev=Object.values(events[date]||{});return `<button class="day ${date===today()?'today':''} ${date===selectedDate?'selected':''}" data-date="${date}"><b>${i+1}</b>${ev.slice(0,2).map(e=>`<span class="event-tag">${esc(e.title)}</span>`).join('')}${ev.length>2?`<small>+${ev.length-2}</small>`:''}</button>`}).join('');document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;renderCalendar();renderSelectedEvents()})}function renderSelectedEvents(){if(!selectedDate)selectedDate=today();$('selectedDateTitle').textContent=selectedDate+' 일정';let es=Object.entries(events[selectedDate]||{});$('selectedEvents').innerHTML=es.length?es.map(([id,e])=>`<div class="preview-item"><b>${esc(e.title)}</b> ${esc(e.time||'')}<p class="muted">${esc(e.place||'')} ${esc(e.note||'')}</p>${parent()?`<button class="smallbtn ghost" data-edit-event="${id}">수정</button> <button class="smallbtn ghost" data-remove-event="${id}">삭제</button>`:''}</div>`).join(''):'<p class="empty">이날 등록된 일정이 없어요.</p>';$('eventEditor').innerHTML=parent()?`<h3>➕ 일정 등록·수정</h3><input id="eventId" type="hidden"><label class="formline">일정 이름<input id="eventTitle" maxlength="80" placeholder="학예회, 생일 등"></label><label class="formline">시간<input id="eventTime" type="time"></label><label class="formline">장소<input id="eventPlace" maxlength="100" placeholder="장소 (선택)"></label><label class="formline">메모<input id="eventNote" maxlength="300" placeholder="준비물 등 (선택)"></label><button id="saveEvent">일정 저장</button>`:'';document.querySelectorAll('[data-remove-event]').forEach(b=>b.onclick=async()=>{if(confirm('이 일정을 삭제할까요?'))await safeWrite(`family/events/${selectedDate}/${b.dataset.removeEvent}`,null)});document.querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>{let e=events[selectedDate][b.dataset.editEvent];$('eventId').value=b.dataset.editEvent;$('eventTitle').value=e.title||'';$('eventTime').value=e.time||'';$('eventPlace').value=e.place||'';$('eventNote').value=e.note||''});if(parent())$('saveEvent').onclick=async()=>{let title=$('eventTitle').value.trim();if(!title)return toast('일정 이름을 입력해 주세요.');let id=$('eventId').value||push(ref(db,'family/events/'+selectedDate)).key;await safeWrite(`family/events/${selectedDate}/${id}`,{title,time:$('eventTime').value,place:$('eventPlace').value.trim(),note:$('eventNote').value.trim()});toast('일정을 저장했어요 💜')}}$('openCalendar').onclick=()=>{month=new Date();selectedDate=today();renderCalendar();renderSelectedEvents();open('calendarDialog')};$('prevMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);renderCalendar()};$('nextMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);renderCalendar()};
function renderChat(){let sender=$('sender'),old=sender.value;let options=parent()?['엄마','아빠']:['서우','서준'];sender.innerHTML=options.map(s=>`<option>${s}</option>`).join('');if(options.includes(old))sender.value=old;let list=Object.entries(messages).sort((a,b)=>a[0].localeCompare(b[0])).slice(-100);$('chatHistory').innerHTML=list.length?list.map(([id,m])=>`<div class="bubble ${options.includes(m.from)?'mine':''}"><small>${esc(m.from)} · ${new Date(m.at||0).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small>${esc(m.text)}</div>`).join(''):'<p class="empty">아직 메시지가 없어요.</p>';$('chatHistory').scrollTop=$('chatHistory').scrollHeight;$('presets').innerHTML=presets.map(s=>`<button type="button" data-preset="${esc(s)}">${esc(s)}</button>`).join('');document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>sendMessage(b.dataset.preset));$('presetEditor').innerHTML=parent()?`<details><summary>⚙️ 간편 메시지 수정 (부모 전용)</summary><div class="stack" style="margin-top:10px"><textarea id="presetText" rows="4" placeholder="한 줄에 하나씩">${esc(presets.join('\n'))}</textarea><button id="savePresets">간편 메시지 저장</button></div></details>`:'';if(parent())$('savePresets').onclick=async()=>{let a=$('presetText').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,30);await safeWrite('family/presets',a);toast('간편 메시지를 저장했어요')}}async function sendMessage(text){if(!signed())return toast('메시지를 보내려면 로그인해 주세요.');text=text.trim();if(!text)return;if(text.length>500)return toast('메시지는 500자 이내로 입력해 주세요.');try{let id=push(ref(db,'family/messages')).key;await safeWrite('family/messages/'+id,{from:$('sender').value,text,at:Date.now(),uid:user.uid});$('chatText').value=''}catch(e){}}$('chatForm').onsubmit=e=>{e.preventDefault();sendMessage($('chatText').value)};$('openChat').onclick=()=>{if(!signed())return open('loginDialog');renderChat();open('chatDialog')};
function setLoginRole(r){loginRole=r;$('roleParent').classList.toggle('active',r==='parent');$('roleChild').classList.toggle('active',r==='child');$('loginError').textContent=''}$('roleParent').onclick=()=>setLoginRole('parent');$('roleChild').onclick=()=>setLoginRole('child');$('loginButton').onclick=()=>{if(signed()){signOut(auth).catch(e=>toast(e.message))}else open('loginDialog')};$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{await signInWithEmailAndPassword(auth,loginRole==='parent'?PARENT_EMAIL:CHILD_EMAIL,$('password').value);$('password').value='';close('loginDialog')}catch(e){$('loginError').textContent='로그인에 실패했어요. 비밀번호를 확인해 주세요. ('+e.code+')'}};
onAuthStateChanged(auth,u=>{user=u;role=u?.email===PARENT_EMAIL?'parent':u?.email===CHILD_EMAIL?'child':'guest';$('authState').textContent=role==='parent'?'🔓 부모 모드 · 가족 연결':role==='child'?'🌼 아이 모드 · 가족 연결':'🔒 로그인 후 가족 정보를 볼 수 있어요';$('loginButton').textContent=signed()?'로그아웃':'🔐 로그인';renderCards();renderPreview();if($('studyDialog').open)renderStudy();if($('chatDialog').open)renderChat();if($('calendarDialog').open){renderCalendar();renderSelectedEvents()}});
onValue(ref(db,'family'),snap=>{data={...defaults,...(snap.val()||{})};events=data.events||{};messages=data.messages||{};presets=Array.isArray(data.presets)&&data.presets.length?data.presets:['❤️ 사랑해!','⭐ 공부 다 했어!','🏠 언제 와?','🍚 배고파!'];connected=true;renderCards();renderPreview();if($('studyDialog').open)renderStudy();if($('calendarDialog').open){renderCalendar();renderSelectedEvents()}if($('chatDialog').open)renderChat()},err=>{if(err.code==='PERMISSION_DENIED')toast('로그인하면 가족 정보를 볼 수 있어요.');else toast('연결 오류: '+err.message)});renderCards();renderPreview();
</script></body></html>
