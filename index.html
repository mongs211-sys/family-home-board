<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>엄마 아빠 언제와요?</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff6ec;color:#55463d;font-family:Arial,'Malgun Gothic',sans-serif}button,input{font:inherit}button{border:0;border-radius:13px;background:#e8d9ff;color:#49395d;padding:9px 12px;cursor:pointer;font-weight:600}button:active{transform:scale(.97)}input{border:1px solid #e5d9ce;border-radius:10px;padding:7px;min-width:0;max-width:100%}h1,h2,h3,p{margin:0}h1{font-size:clamp(19px,2.4vw,28px)}h2{font-size:clamp(16px,1.7vw,21px);margin-bottom:9px}h3{font-size:17px}.shell{max-width:1400px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.top{display:flex;align-items:center;gap:14px;background:#ffe3d6;border-radius:22px;padding:8px 20px;min-height:92px}.top img{height:78px;width:128px;object-fit:contain}.toptext{flex:1}.clock{font-size:14px;margin-top:5px}.tag{font-size:13px;margin-top:4px;color:#876a60}.dashboard{display:grid;grid-template-columns:1.05fr .95fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px;min-height:0;flex:1}.card{background:#fff;border-radius:20px;padding:14px;box-shadow:0 3px 12px #9c80621a;min-height:0;overflow:auto}.family-card{grid-column:1;grid-row:1/3}.commute{grid-column:2;grid-row:1}.classroom{grid-column:2;grid-row:2}.kids{grid-column:3;grid-row:1}.messages{grid-column:3;grid-row:2}.people{display:grid;grid-template-columns:1fr 1fr;gap:8px}.person{background:#f7f3ff;border-radius:15px;text-align:center;padding:7px 4px;min-width:0}.person img{height:clamp(95px,19vh,200px);max-width:100%;width:100%;object-fit:contain;object-position:center top;display:block}.person h3{margin:2px 0}.status{font-weight:bold;color:#7661a4;font-size:14px;line-height:1.35}.kids .person{background:#fff9ed}.kids .person img{height:clamp(75px,14vh,145px)}.kidbtn{font-size:12px;padding:7px;margin-top:5px}.controls{display:flex;flex-wrap:wrap;gap:5px}.controls button{font-size:13px;padding:8px 10px}.mini{font-size:13px;color:#86776b}.big{font-size:clamp(18px,2vw,27px);color:#8563b1;font-weight:bold;margin:8px 0}.line{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:8px 0}.road{background:#e6f4e7;border-radius:13px;height:52px;display:flex;justify-content:space-around;align-items:center;font-size:29px}.road #car{position:relative;transition:transform .5s}.note{background:#fff0c9;border-radius:12px;padding:10px;font-size:14px;margin-top:9px;line-height:1.45;min-height:42px}.message-buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.message-buttons button{font-size:14px;padding:10px 4px}.msg-list{font-size:13px;line-height:1.5;margin-top:7px}.msg-list div{padding:5px 0;border-bottom:1px solid #f5e8dc}.msg-list div:last-child{border:0}details{margin-top:10px}summary{cursor:pointer;font-size:13px;color:#7463a7;font-weight:bold}details p{margin:8px 0 4px;font-size:13px}.foot{text-align:center;font-size:11px;color:#9a887e}
@media (min-width:700px) and (orientation:landscape){html,body{height:100%;overflow:hidden}.shell{height:100dvh;padding:8px;gap:7px}.top{min-height:0;height:clamp(65px,12vh,95px);flex:none}.top img{height:100%;width:110px}.dashboard{grid-template-rows:minmax(0,1fr) minmax(0,1fr)}.card{padding:10px}.family-card .person img{height:clamp(75px,21vh,190px)}.kids .person img{height:clamp(65px,13vh,120px)}.foot{display:none}.line{margin:5px 0}.big{margin:4px 0}.note{padding:7px;margin-top:6px}.message-buttons button{padding:7px 3px}.road{height:40px}}
@media(max-width:699px), (orientation:portrait){.dashboard{display:flex;flex-direction:column}.shell{padding:12px}.top{padding:12px}.top img{width:95px;height:85px}.card{overflow:visible}.person img,.family-card .person img{height:165px}.kids .person img{height:145px}.foot{padding:10px}}
@media (min-width:700px) and (orientation:landscape) and (max-height:550px){h2{font-size:15px;margin-bottom:5px}.top{height:58px}.top img{width:88px}.family-card .person img{height:20vh}.kids .person img{height:12vh}.card{padding:8px}.person{padding:4px}.status,.mini,.note{font-size:12px}.controls button,.message-buttons button{font-size:12px;padding:5px}.road{height:33px;font-size:22px}.line{margin:3px 0}.big{font-size:17px}}
</style>
</head>
<body><div class="shell">
<header class="top"><img src="family.png" alt="우리 가족"><div class="toptext"><h1>💕 엄마 아빠 언제와요? 💕</h1><div id="clock" class="clock"></div><div class="tag">서우와 서준이의 우리 가족 보드 ❤️</div></div></header>
<main class="dashboard">
<section class="card family-card"><h2>🏡 우리 가족은 지금?</h2><div class="people"><div class="person"><img src="mom.png" alt="엄마"><h3>엄마</h3><p class="status" id="momStatus">🏠 집에 있어요</p></div><div class="person"><img src="dad.png" alt="아빠"><h3>아빠</h3><p class="status" id="dadStatus">💼 일하는 중</p></div></div><details><summary>⚙️ 엄마 아빠 상태 바꾸기</summary><p>엄마</p><div class="controls"><button onclick="change('mom','🏠 집에 있어요')">집</button><button onclick="change('mom','👩‍🏫 수업 중')">수업</button><button onclick="change('mom','🚗 집에 가는 중')">귀가</button></div><p>아빠</p><div class="controls"><button onclick="change('dad','💼 일하는 중')">회사</button><button onclick="change('dad','🚗 집에 가는 중')">귀가</button><button onclick="change('dad','🏠 집에 도착')">도착</button></div></details></section>
<section class="card commute"><h2>🚗 아빠가 집에 오는 길</h2><div class="road"><span>🏢</span><span id="car">🚙</span><span>🏡</span></div><div class="line"><label for="arrival" class="mini">도착 예정</label><input type="time" id="arrival" value="19:30"><button onclick="saveArrival()">설정</button></div><p class="big" id="arrivalText">도착 시간을 설정해 주세요</p><p class="mini">예상 도착 시간 기준이에요.</p></section>
<section class="card classroom"><h2>👩‍🏫 엄마는 수업 중!</h2><div class="line"><span>📚 남은 학생</span><strong class="big"><span id="students">4</span>명</strong></div><div class="controls"><button onclick="student(-1)">✓ 1명 완료</button><button onclick="student(1)">+ 1명 추가</button></div><div class="line"><label for="breakTime" class="mini">☕ 쉬는 시간</label><input type="time" id="breakTime" value="17:30"><button onclick="saveBreak()">설정</button></div><p id="breakText" class="mini"></p><div class="line"><label for="endTime" class="mini">🏡 수업 종료</label><input type="time" id="endTime" value="20:00"><button onclick="saveEnd()">설정</button></div><p id="endText" class="mini"></p></section>
<section class="card kids"><h2>🌈 서우와 서준이의 놀이터</h2><div class="people"><div class="person"><img src="seowoo.png" alt="서우"><h3>💜 서우</h3><button class="kidbtn" onclick="sendFrom('서우','❤️ 사랑해요!')">❤️ 사랑해요</button><button class="kidbtn" onclick="sendFrom('서우','🌟 칭찬해 줘요!')">🌟 칭찬해 줘요</button></div><div class="person"><img src="seojun.png" alt="서준"><h3>💛 서준</h3><button class="kidbtn" onclick="sendFrom('서준','❤️ 사랑해요!')">❤️ 사랑해요</button><button class="kidbtn" onclick="sendFrom('서준','🎮 같이 놀아요!')">🎮 같이 놀아요</button></div></div></section>
<section class="card messages"><h2>💌 엄마 아빠에게 말하기</h2><div class="message-buttons"><button onclick="send('❤️ 보고 싶어요!')">❤️ 보고 싶어요</button><button onclick="send('🍚 배고파요!')">🍚 배고파요</button><button onclick="send('🥰 사랑해요!')">🥰 사랑해요</button><button onclick="send('🎮 같이 놀아요!')">🎮 같이 놀아요</button></div><div class="note" id="message">어떤 말을 전하고 싶나요? 💕</div><div id="msgList" class="msg-list"></div></section>
</main><footer class="foot">우리 가족만의 따뜻한 공간 🏡</footer></div>
<script>
const $=id=>document.getElementById(id);
function clock(){$('clock').textContent=new Date().toLocaleString('ko-KR',{dateStyle:'full',timeStyle:'medium'});}clock();setInterval(clock,1000);
function change(person,value){localStorage.setItem(person+'Status',value);$(person+'Status').textContent=value;}
function student(n){let count=Math.max(0,Number($('students').textContent)+n);$('students').textContent=count;localStorage.setItem('students',count);}
function saveArrival(){localStorage.setItem('arrival',$('arrival').value);updateArrival();}
function updateArrival(){let t=$('arrival').value;if(!t)return;let now=new Date(),target=new Date(),[h,m]=t.split(':').map(Number);target.setHours(h,m,0,0);let minutes=Math.ceil((target-now)/60000);$('arrivalText').textContent=minutes>0?'약 '+minutes+'분 남았어요 💕':'예정 시간이 지났어요';}
function saveBreak(){localStorage.setItem('breakTime',$('breakTime').value);$('breakText').textContent='쉬는 시간: '+$('breakTime').value;}
function saveEnd(){localStorage.setItem('endTime',$('endTime').value);$('endText').textContent='수업 종료: '+$('endTime').value;}
function renderMessages(){let items=JSON.parse(localStorage.getItem('familyMessages')||'[]');$('msgList').innerHTML='';items.slice(0,3).forEach(item=>{let d=document.createElement('div');d.textContent=item.from+': '+item.message;$('msgList').appendChild(d);});}
function sendFrom(from,message){$('message').textContent=from+'가 보냈어요: '+message;let items=JSON.parse(localStorage.getItem('familyMessages')||'[]');items.unshift({from,message});localStorage.setItem('familyMessages',JSON.stringify(items.slice(0,20)));renderMessages();}
function send(message){$('message').textContent=message;}
function restore(){['mom','dad'].forEach(p=>{let v=localStorage.getItem(p+'Status');if(v)$(p+'Status').textContent=v;});let n=localStorage.getItem('students');if(n!==null)$('students').textContent=n;['arrival','breakTime','endTime'].forEach(id=>{let v=localStorage.getItem(id);if(v)$(id).value=v;});updateArrival();$('breakText').textContent='쉬는 시간: '+$('breakTime').value;$('endText').textContent='수업 종료: '+$('endTime').value;renderMessages();}restore();setInterval(updateArrival,30000);
</script></body></html>
